# Builds one-click downloads every time you publish a GitHub release with GigSprout.zip attached:
#   GigSprout-Setup.exe  (Windows installer: Node included, desktop + Start menu shortcuts, no unzipping)
#   GigSprout-Mac.zip    (Mac: Node included, double-click START HERE (Mac))
name: Build installers
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  NODE_VERSION: v22.11.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get GigSprout.zip from the release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = gh release view --repo "${{ github.repository }}" --json tagName -q .tagName }
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV
          gh release download $tag --repo "${{ github.repository }}" --pattern "GigSprout.zip" --dir in
          Expand-Archive in/GigSprout.zip -DestinationPath app
          $root = (Get-ChildItem app -Directory | Select-Object -First 1).FullName
          "APPROOT=$root" | Out-File -Append $env:GITHUB_ENV
      - name: Add Node.js
        shell: pwsh
        run: |
          $v = $env:NODE_VERSION
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp
          New-Item -ItemType Directory "$env:APPROOT\node" -Force | Out-Null
          Copy-Item "nodetmp\node-$v-win-x64\node.exe" "$env:APPROOT\node\"
      - name: Build GigSprout-Setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = $env:TAG -replace '[^0-9.]', ''
          @"
          [Setup]
          AppName=GigSprout
          AppVersion=$ver
          AppPublisher=GigSprout
          DefaultDirName={localappdata}\GigSprout App
          DisableProgramGroupPage=yes
          DisableDirPage=yes
          PrivilegesRequired=lowest
          OutputDir=out
          OutputBaseFilename=GigSprout-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=force
          [Files]
          Source: "$env:APPROOT\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{userprograms}\GigSprout"; Filename: "{sys}\wscript.exe"; Parameters: """{app}\GigSprout.vbs"""; WorkingDir: "{app}"
          Name: "{userdesktop}\GigSprout"; Filename: "{sys}\wscript.exe"; Parameters: """{app}\GigSprout.vbs"""; WorkingDir: "{app}"
          Name: "{userprograms}\Stop GigSprout"; Filename: "{app}\Stop GigSprout.bat"; WorkingDir: "{app}"
          [Run]
          Filename: "{sys}\wscript.exe"; Parameters: """{app}\GigSprout.vbs"""; Description: "Open GigSprout now"; Flags: postinstall nowait
          [UninstallRun]
          Filename: "{sys}\taskkill.exe"; Parameters: "/IM node.exe /F"; Flags: runhidden; RunOnceId: "StopGigSprout"
          "@ | Set-Content setup.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss
      - name: Attach to the release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload $env:TAG out/GigSprout-Setup.exe --clobber --repo "${{ github.repository }}"

  mac:
    runs-on: ubuntu-latest
    steps:
      - name: Get GigSprout.zip and add Node.js for Mac
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          echo "TAG=$TAG" >> $GITHUB_ENV
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "GigSprout.zip" --dir in
          unzip -q in/GigSprout.zip -d app
          ROOT=$(find app -mindepth 1 -maxdepth 1 -type d | head -1)
          for A in arm64 x64; do
            curl -sL "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-darwin-$A.tar.gz" | tar xz
            mkdir -p "$ROOT/node/$A/bin" && cp "node-$NODE_VERSION-darwin-$A/bin/node" "$ROOT/node/$A/bin/node"
          done
          chmod +x "$ROOT"/node/*/bin/node "$ROOT/START HERE (Mac).command"
          mv "$ROOT" GigSprout && zip -qry GigSprout-Mac.zip GigSprout
          gh release upload "$TAG" GigSprout-Mac.zip --clobber --repo "${{ github.repository }}"
